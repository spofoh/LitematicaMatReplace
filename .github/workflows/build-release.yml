name: Build and prerelease

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test all Minecraft versions
        shell: bash
        run: |
          bash ./gradlew :26.1:build :26.1.1:build :26.1.2:build :26.2:build --console=plain --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [[ $result -ne 0 ]]; then
            failure=$(sed -n '/^FAILURE: Build failed/,/^\* Try:/p' build.log | head -n 60)
            if [[ -z $failure ]]; then
              failure=$(tail -n 40 build.log)
            fi
            failure=${failure//'%'/'%25'}
            failure=${failure//$'\r'/'%0D'}
            failure=${failure//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$failure"
            {
              echo '### Gradle build failure'
              echo '```text'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi

      - name: Check release jars
        shell: bash
        run: |
          for version in 26.1 26.1.1 26.1.2 26.2; do
            jars=(versions/"$version"/build/libs/lmr-fabric-"$version"-*.jar)
            if [[ ${#jars[@]} -ne 1 || ! -f ${jars[0]} ]]; then
              echo "Expected exactly one release jar for Minecraft $version" >&2
              exit 1
            fi
          done

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: versions/*/build/libs/lmr-fabric-*.jar
